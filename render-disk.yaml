services:
  - type: web
    name: siloe-iglesia-presbiteriana
    runtime: docker
    plan: starter
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /health
    disk:
      name: siloe-datos
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      - key: DB_PATH
        value: /app/data/church.sqlite
      - key: SETUP_TOKEN
        generateValue: true
